name: Release

# Create (publish) a release on GitHub with a tag such as v0.3.4. This workflow
# then builds dinput8.dll from that tag, stamps the version into it and attaches
# AutoPerfectBuild-<tag>.zip and SHA256SUMS.txt to the same release.
# It can also be re-run by hand from the Actions tab for an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to rebuild, e.g. v0.3.4"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Version from tag
        run: |
          ver="${TAG#v}"
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "Building version $ver from tag $TAG"

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 cmake zip

      - name: Build
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake -DCMAKE_BUILD_TYPE=Release -DAPB_VERSION="$VERSION"
          cmake --build build
          strings build/dinput8.dll | grep -qx "$VERSION" || { echo "::error::version string missing from DLL"; exit 1; }

      - name: Package
        run: |
          name="AutoPerfectBuild-$TAG"
          mkdir -p "dist/$name"
          cp build/dinput8.dll README.md LICENSE "dist/$name/"
          cat > "dist/$name/INSTALL.txt" <<'TXT'
          Auto Perfect Build - LEGO The Hobbit (PC, Steam, DX9)

          Install:   copy dinput8.dll into the game folder next to LEGOHobbit.exe
                     (default: C:\Program Files (x86)\Steam\steamapps\common\LEGO - The Hobbit\)
          Use:       pause in game, press Tab (controller: Back) to open the MODS panel
          Uninstall: delete dinput8.dll (and AutoPerfectBuild.ini / .log if present)

          Only the Steam LEGOHobbit.exe (32-bit DX9) is supported; on any other exe
          the mod stays inactive. See README.md for details.
          TXT
          (cd dist && zip -r "$name.zip" "$name")
          (cd dist && sha256sum "$name.zip" "$name/dinput8.dll" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/AutoPerfectBuild-$TAG.zip" dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
