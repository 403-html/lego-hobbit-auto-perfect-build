name: Release

# Push a tag like v0.3.3 (it must match APB_VERSION in src/game.h) to build
# dinput8.dll and publish a GitHub release with a ready-to-install zip.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.3.3"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches APB_VERSION
        run: |
          ver=$(sed -n 's/^#define APB_VERSION "\(.*\)"/\1/p' src/game.h)
          echo "APB_VERSION=$ver, tag=$TAG"
          [ "v$ver" = "$TAG" ] || { echo "::error::Tag $TAG does not match APB_VERSION $ver in src/game.h"; exit 1; }

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 cmake zip

      - name: Build
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package
        run: |
          name="AutoPerfectBuild-$TAG"
          mkdir -p "dist/$name"
          cp build/dinput8.dll README.md LICENSE "dist/$name/"
          cat > "dist/$name/INSTALL.txt" <<'TXT'
          Auto Perfect Build - LEGO The Hobbit (PC, Steam, DX9)

          Install:   copy dinput8.dll into the game folder next to LEGOHobbit.exe
                     (default: C:\Program Files (x86)\Steam\steamapps\common\LEGO - The Hobbit\)
          Use:       pause in game, press Tab (controller: Back) to open the MODS panel
          Uninstall: delete dinput8.dll (and AutoPerfectBuild.ini / .log if present)

          Only the Steam LEGOHobbit.exe (32-bit DX9) is supported; on any other exe
          the mod stays inactive. See README.md for details.
          TXT
          (cd dist && zip -r "$name.zip" "$name")
          (cd dist && sha256sum "$name.zip" "$name/dinput8.dll" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="AutoPerfectBuild-$TAG"
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease";; esac
          notes="Install: unzip and copy \`dinput8.dll\` next to \`LEGOHobbit.exe\`. Pause in game and press **Tab** (controller: **Back**) for the MODS panel. Uninstall: delete \`dinput8.dll\`.

          Supports only the Steam \`LEGOHobbit.exe\` (32-bit DX9). On any other executable the mod stays inactive.

          SHA-256:
          \`\`\`
          $(cat dist/SHA256SUMS.txt)
          \`\`\`"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$name.zip" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "dist/$name.zip" dist/SHA256SUMS.txt \
              --title "Auto Perfect Build $TAG" --notes "$notes" $prerelease
          fi
